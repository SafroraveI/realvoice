name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          mkdir www
          echo "=== files in repo ==="
          ls -1
          for f in index.html script.js; do
            [ -f "$f" ] || { echo "::error::الملف الأساسي $f مش موجود في الريبو (راجع الاسم)"; exit 1; }
          done
          for f in index.html admin.html script.js manifest.json sw.js ice-theme.css; do
            b="${f%.*}"; e="${f##*.}"
            if [ -f "$f" ]; then cp "$f" "www/$f"
            else
              alt=$(ls "$b"*."$e" 2>/dev/null | head -1)
              if [ -n "$alt" ]; then echo "::warning::$f مش موجود، هستخدم $alt بداله"; cp "$alt" "www/$f"
              else echo "::warning::skip $f (not found)"; fi
            fi
          done
          cp *.png www/ 2>/dev/null || true
          npm install
          npx cap add android
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          mkdir -p ~/.android
          SRC=""
          [ -f icon-512.png ] && SRC=icon-512.png
          [ -f app-icon.png ] && SRC=app-icon.png
          if [ -n "$SRC" ]; then
            echo "Using icon: $SRC"
            sudo apt-get install -y -qq imagemagick || true
            IM=$(command -v magick || command -v convert || true)
            if [ -n "$IM" ]; then
              for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
                n=${d%%:*}; s=${d##*:}
                $IM "$SRC" -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png || true
                $IM "$SRC" -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher_round.png || true
              done
              rm -rf android/app/src/main/res/mipmap-anydpi-v26
            fi
          else
            echo "No icon file found, using default icon"
          fi
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore
          echo "=== REPO KEYSTORE ==="
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias|SHA1" || true
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle || true
          cp google-services.json android/app/google-services.json
          PERMS='<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.CAMERA"/>'
          sed -i "s#<application#${PERMS}<application#" android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show APK signing SHA-1
        continue-on-error: true
        run: |
          echo "=== APK SIGNATURE ==="
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1|SHA-1|Owner"
          echo "=== google-services client ==="
          grep -E "package_name|certificate_hash" android/app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: RealVoice-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
